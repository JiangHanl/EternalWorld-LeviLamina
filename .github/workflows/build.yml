name: Windows native build
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
    outputs:
      commit:
        value: ${{ jobs.windows.outputs.commit }}
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Record source commit
        id: identity
        run: |
          $commit = (git rev-parse --verify HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve build commit' }
          "commit=$commit" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      - name: Prepare hash-verified official XMake, LLVM 22, SQLite and recipes
        run: ./tools/Prepare-CI.ps1
      - name: Audit public source tree
        run: ./tools/Test-PublicTree.ps1
      - name: Build Host and all eight internal modules
        run: ./tools/Build-Release.ps1
      - name: Run SDK, Core domain, Host and actual DLL checks
        run: ./tools/Test-Release.ps1
      - name: Package Eternal only
        env:
          BUILD_COMMIT: ${{ steps.identity.outputs.commit }}
        run: ./tools/Package-Release.ps1 -Commit $env:BUILD_COMMIT
      - name: Upload release candidate and SHA256
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EternalWorld-windows-x64
          path: |
            dist/EternalWorld-*-windows-x64.zip
            dist/EternalWorld-*-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Package isolated Phase2 validation fixture
        run: ./tools/Package-Validation.ps1
      - name: Upload isolated Phase2 validation fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: EternalPhase2Validation-windows-x64
          path: |
            dist/validation/CoreValidationModule.dll
            dist/validation/README.txt
          if-no-files-found: error
          retention-days: 14
